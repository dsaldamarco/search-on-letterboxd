<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2228"/>
      <stop offset="1" stop-color="#14181c"/>
    </linearGradient>
  </defs>

  <!-- Browser window -->
  <rect width="760" height="420" rx="14" fill="url(#bg)"/>
  <rect width="760" height="44" rx="14" fill="#2b3036"/>
  <rect y="30" width="760" height="14" fill="#2b3036"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <rect x="96" y="11" width="420" height="22" rx="11" fill="#1c2024"/>
  <text x="114" y="27" font-size="12" fill="#9ab">example-blog.com/best-films-of-the-decade</text>

  <!-- Page text -->
  <text x="40" y="92" font-size="22" font-weight="600" fill="#e6ecf0">10 films you need to watch this year</text>
  <text x="40" y="132" font-size="16" fill="#a9b6c2">My favourite of the bunch? I finally watched</text>
  <rect x="355" y="115" width="84" height="24" rx="3" fill="#3d7bd9"/>
  <text x="359" y="132" font-size="16" fill="#ffffff">Past Lives</text>
  <text x="445" y="132" font-size="16" fill="#a9b6c2">and I can't stop</text>
  <text x="40" y="158" font-size="16" fill="#a9b6c2">thinking about it. Quiet, devastating, perfect.</text>
  <rect x="40" y="184" width="300" height="10" rx="5" fill="#2a3138"/>
  <rect x="40" y="206" width="250" height="10" rx="5" fill="#2a3138"/>
  <rect x="40" y="228" width="280" height="10" rx="5" fill="#2a3138"/>

  <!-- Context menu -->
  <g filter="url(#shadow)">
    <rect x="410" y="146" width="300" height="236" rx="8" fill="#2b2a33" stroke="#4a4955"/>
  </g>
  <g font-size="14" fill="#fbfbfe">
    <text x="440" y="176">Copy</text>
    <text x="440" y="208">Select All</text>
    <text x="440" y="240">Search Google for “Past Lives”</text>
    <text x="440" y="272">Translate Selection</text>
  </g>
  <line x1="418" y1="288" x2="702" y2="288" stroke="#4a4955"/>

  <!-- Highlighted item -->
  <rect x="416" y="296" width="288" height="34" rx="5" fill="#3d3c47"/>
  <rect x="426" y="304" width="18" height="18" rx="4" fill="#14181c"/>
  <circle cx="430.5" cy="313" r="3.2" fill="#ff8000"/>
  <circle cx="439.5" cy="313" r="3.2" fill="#40bcf4"/>
  <circle cx="435" cy="313" r="3.2" fill="#00e054"/>
  <text x="456" y="318" font-size="14" font-weight="600" fill="#ffffff">Search on Letterboxd</text>

  <line x1="418" y1="338" x2="702" y2="338" stroke="#4a4955"/>
  <text x="440" y="364" font-size="14" fill="#fbfbfe">Inspect</text>

  <!-- Cursor -->
  <path d="M600 306 l0 20 l5 -5 l4 9 l4 -2 l-4 -9 l7 0 z" fill="#fff" stroke="#000" stroke-width="1"/>
</svg>
